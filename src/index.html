<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:;">
  <title>WoW PvP Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --alliance: #0078ff;
      --horde: #b30000;
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }
    .logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .logo h1 {
      font-size: 18px;
      color: var(--accent);
    }
    .logo span {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-btn.active { background: var(--bg-tertiary); color: var(--accent); border-left: 3px solid var(--accent); }
    .nav-icon { font-size: 18px; width: 24px; text-align: center; }

    /* Main Content */
    .main {
      flex: 1;
      padding: 30px 40px;
      overflow-y: auto;
    }
    .view { display: none; }
    .view.active { display: block; }

    h2 { margin-bottom: 20px; font-weight: 600; }

    /* Search */
    .search-form {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }
    input, select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    input::placeholder { color: var(--text-secondary); }
    .search-form input { flex: 1; max-width: 250px; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Character Profile */
    .character-profile {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .char-header {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 8px;
      border: 2px solid var(--border);
    }
    .char-info h2 { margin-bottom: 8px; font-size: 24px; }
    .char-details { display: flex; gap: 8px; margin-bottom: 8px; }
    .char-details span {
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    .char-meta { color: var(--text-secondary); font-size: 13px; display: flex; gap: 16px; }
    .faction.alliance { color: var(--alliance); }
    .faction.horde { color: var(--horde); }

    .pvp-stats { margin-top: 20px; }
    .honor-info {
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      gap: 24px;
    }
    .ratings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .rating-card {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .rating-card .bracket {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .rating-card .rating {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .rating-card .record { font-size: 14px; color: var(--text-secondary); }
    .rating-card .winrate { font-size: 13px; color: var(--success); margin-top: 4px; }

    /* Leaderboard */
    .bracket-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .bracket-tabs button {
      padding: 8px 20px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .bracket-tabs button:hover { border-color: var(--accent); color: var(--text-primary); }
    .bracket-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-secondary);
      border-radius: 8px;
      overflow: hidden;
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .leaderboard-table th {
      background: var(--bg-tertiary);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .leaderboard-table tr:hover { background: var(--bg-tertiary); }
    .leaderboard-table .rank { color: var(--text-secondary); width: 60px; }
    .leaderboard-table .player .name { font-weight: 500; }
    .leaderboard-table .player .realm { color: var(--text-secondary); font-size: 12px; margin-left: 8px; }
    .leaderboard-table .rating { font-weight: 600; }

    /* Settings */
    .settings-form {
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; color: var(--text-secondary); }
    .form-group input, .form-group select { width: 100%; }
    .settings-note {
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .settings-note a { color: var(--accent); }
    #api-status { margin-top: 12px; }
    .status-ok { color: var(--success); }
    .status-warn { color: var(--warning); }

    /* Utilities */
    .loading, .error, .no-data {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    .error { color: var(--error); }
    #loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #loader::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <h1>WoW PvP</h1>
      <span>Analyzer</span>
    </div>
    <button class="nav-btn active" data-nav="search">
      <span class="nav-icon">🔍</span> Player Search
    </button>
    <button class="nav-btn" data-nav="leaderboard">
      <span class="nav-icon">🏆</span> Leaderboards
    </button>
    <button class="nav-btn" data-nav="settings">
      <span class="nav-icon">⚙️</span> Settings
    </button>
  </aside>

  <main class="main">
    <!-- Search View -->
    <div id="view-search" class="view active">
      <h2>Player Search</h2>
      <form id="search-form" class="search-form">
        <input type="text" id="search-input" placeholder="Character name" required>
        <input type="text" id="realm-input" placeholder="Realm (e.g. Ravencrest)" required>
        <button type="submit" class="btn">Search</button>
      </form>
      <div id="search-result"></div>
    </div>

    <!-- Leaderboard View -->
    <div id="view-leaderboard" class="view">
      <h2>PvP Leaderboards</h2>
      <div class="bracket-tabs">
        <button data-bracket="3v3" class="active">3v3 Arena</button>
        <button data-bracket="2v2">2v2 Arena</button>
        <button data-bracket="rbg">Rated BG</button>
      </div>
      <div id="leaderboard-list">
        <div class="no-data">Select a bracket to view rankings</div>
      </div>
    </div>

    <!-- Settings View -->
    <div id="view-settings" class="view">
      <h2>API Settings</h2>
      <div class="settings-note">
        To use this app, you need Blizzard API credentials.<br>
        Get them at <a href="https://develop.battle.net/" target="_blank">develop.battle.net</a>
      </div>
      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label>Client ID</label>
          <input type="text" id="client-id" placeholder="Enter your Client ID">
        </div>
        <div class="form-group">
          <label>Client Secret</label>
          <input type="password" id="client-secret" placeholder="Enter your Client Secret">
        </div>
        <div class="form-group">
          <label>Region</label>
          <select id="region-select">
            <option value="eu">Europe</option>
            <option value="us">US</option>
            <option value="kr">Korea</option>
            <option value="tw">Taiwan</option>
          </select>
        </div>
        <button type="submit" class="btn">Save Settings</button>
        <div id="api-status"></div>
      </form>
    </div>
  </main>

  <div id="loader"></div>
  <div id="message"></div>
</body>
</html>
